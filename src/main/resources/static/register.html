<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="https://stevenbenner.github.io/jquery-powertip/styles/jquery.powertip.css">
</head>
<body>
    <header>
        <h1>Registrierung</h1>
    </header>
    <div class="layout">
        <nav>
            <ul>
                <li><a href="liste.html">Nachrichten</a></li>
                <li><a href="message.html">Neue Nachricht</a></li>
                <li><a href="register.html">Registrierung</a></li>
            </ul>
        </nav>
        <main>
            <form>
                <fieldset>
                    <legend>Benutzerdaten</legend>
					<label for="username">Benutzername:</label>
                    <input type="text" id="username" name="username" required title="Bitte geben Sie Ihren Benutzernamen ein.">
                    <label for="password">Passwort:</label>
                    <input type="password" id="password" name="password" required title="Wählen Sie ein sicheres Passwort.">
                    <label for="email">E-Mail:</label>
                    <input type="email" id="email" name="email" required title="Geben Sie Ihre E-Mail-Adresse ein.">
                </fieldset>
                <button type="submit">Registrieren</button>
            </form>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Registrierung</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://stevenbenner.github.io/jquery-powertip/scripts/jquery.powertip.js"></script>
    <script src="js/meineScripts.js"></script>
</body>
</html>
