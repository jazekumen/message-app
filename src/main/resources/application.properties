logging.level.root=INFO

# Embedded H2 database. In-memory by default: every restart starts fresh with the demo data.
# To keep your data between restarts use a file instead, e.g.:
#   app.datasource.url=jdbc:h2:file:./data/messages
app.datasource.url=jdbc:h2:mem:messages;DB_CLOSE_DELAY=-1

# Create two demo users (heike / stefan, password "demo") and a few messages when the database is empty
app.demo-data=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.cache=false
